spring:
  application:
    name: plateforme

  datasource:
    url: jdbc:postgresql://localhost:5432/plateforme_db
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # On supprime les anciennes propriétés multiTenancy complexes si elles bloquaient,
        # ou on laisse juste notre filtre propager le TenantContext.


  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/plateforme_db
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations:
      - classpath:db/migration

tenant:
  provisioning:
    host: localhost
    port: 5432
    database: plateforme_db  # <-- Remplace "postgres" par "plateforme_db"
    username: ${DB_SCHEMA_USERNAME}  # Tu peux réutiliser ton utilisateur principal s'il a les droits sur la base
    password: ${DB_SCHEMA_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 300000   # 5-minutes #1mn = 60s et 1s = 1000millisecondes donc =>temps en ms = mn * 60s * 1000millisecondes