spring:
  application:
    name: plateforme

  datasource:
    url: jdbc:postgresql://localhost:5432/plateforme_db
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        multiTenancy: SCHEMA


  flyway:
    enabled: true
    url: jdbc:postgresql://localhost:5432/plateforme_db
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
    locations:
      - classpath:db/migration

tenant:
  provisioning:
    host: localhost
    port: 5432
    database: plateforme_db  # <-- Remplace "postgres" par "plateforme_db"
    username: ${DB_SCHEMA_USERNAME}  # Tu peux réutiliser ton utilisateur principal s'il a les droits sur la base
    password: ${DB_SCHEMA_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration: 300000   # 5-minutes